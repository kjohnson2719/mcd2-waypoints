# Builds the mod on every push and pull request, and publishes a GitHub release for version tags.
#
#   git tag v1.0
#   git push origin v1.0
#
# makes release "Waypoints 1.0" with Waypoints-1.0.zip (the folder players drop into Paks\~mods).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NeoRune packs with Windows tools (retoc, repak). The game isn't needed to build, only to install.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install NeoRune
        shell: pwsh
        run: |
          # The same version as the project's NeoRune.Sdk.
          dotnet tool install -g NeoRune.Tool --version 1.0.0
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          (Get-Content Waypoints.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content Waypoints.csproj
          "Version $version"

      - name: Build and pack
        shell: pwsh
        # A Release build (diagnostics off), zipped as Waypoints-<version>.zip: the mod's folder and a README.
        run: neorune pack --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: Waypoints
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Waypoints ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Install:** install [Blueprint Loader](https://www.nexusmods.com/minecraftdungeons2/mods/2), then extract the `Waypoints` folder from the zip below into the game's `Dungeons\Content\Paks\~mods` folder (so you have `~mods\Waypoints\Waypoints_P.pak`). Settings and keys are in the game's Settings, Mods tab.
